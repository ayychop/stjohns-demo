    <!--
      Loading screen. It is plain HTML and CSS, not a React component, so it
      paints the instant the page arrives instead of waiting for the JavaScript.
      src/main.jsx fades it out once the app is ready and it has had its time.
    -->
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3.75rem; /* room for the shop's corners as it turns */
        padding: 1.5rem;
        background: #f5efe0;
        text-align: center;
        transition: opacity 0.6s ease, visibility 0.6s;
      }
      #preloader.done {
        opacity: 0;
        visibility: hidden;
      }
      #preloader svg {
        width: min(58vw, 15rem);
        height: auto;
        /* One calm full turn every six seconds. */
        animation: preloader-turn 6s linear infinite;
      }
      #preloader .name {
        color: #1a2340;
        font: 900 clamp(1.9rem, 9vw, 4rem) / 1 'Fraunces Variable', Georgia, 'Times New Roman', serif;
        letter-spacing: -0.01em;
      }
      #preloader .tag {
        margin-top: 0.9rem;
        padding-left: 0.4em; /* balances the trailing letter-spacing so it sits centred */
        color: #6b1e2e;
        font: 700 clamp(0.8rem, 2.8vw, 1.05rem) / 1 'Inter Variable', system-ui, sans-serif;
        letter-spacing: 0.4em;
      }
      @keyframes preloader-turn {
        to {
          transform: rotate(360deg);
        }
      }
      /* Reduced motion: the shop stands still. */
      @media (prefers-reduced-motion: reduce) {
        #preloader svg {
          animation: none;
        }
      }
      html.skip-preloader #preloader {
        display: none;
      }
    </style>
    <script>
      // Only show the loading screen on the first page of a browser session.
      try {
        if (sessionStorage.getItem('sj-seen')) document.documentElement.classList.add('skip-preloader')
        else sessionStorage.setItem('sj-seen', '1')
      } catch (e) {}
    </script>
    <noscript>
      <style>
        #preloader {
          display: none;
        }
      </style>
    </noscript>
  </head>
